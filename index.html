<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>site oficial N1k3</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .produto {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .produto img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    .produto h2 {
      margin: 10px 0;
      font-size: 20px;
    }

    .produto p {
      color: green;
      font-size: 18px;
      margin-bottom: 10px;
    }

    button {
      background: black;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    .carrinho {
      margin-top: 40px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .item-carrinho {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .total {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>N1k3</h1>

  <div class="produtos">

    <div class="produto">
      <img src="https://pbs.twimg.com/media/EPj0gMqX4AEASX6.jpg">
      <h2>Tênis</h2>
      <p>R$ 199,90</p>
      <button onclick="adicionar('Tênis', 199.90)">Adicionar</button>
    </div>

    <div class="produto">
      <img src="https://preview.redd.it/found-this-in-my-old-clothes-didnt-know-i-had-this-shirt-tbh-v0-9fd6cv1mjq6e1.jpeg?width=640&crop=smart&auto=webp&s=b6a19d47cba855546fb8bc5b5c845611228089fc">
      <h2>Camiseta</h2>
      <p>R$ 79,90</p>
      <button onclick="adicionar('Camiseta', 79.90)">Adicionar</button>
    </div>

    <div class="produto">
      <img src="https://photos.enjoei.com.br/replica-lacoste-44775508/800x800/czM6Ly9waG90b3MuZW5qb2VpLmNvbS5ici9wcm9kdWN0cy8xNDM4MjA4MS8yOWFhY2I4MDkzZTFiM2M5N2U4N2M4OWQ4OGEyZTZhMS5qcGc">
      <h2>Relógio</h2>
      <p>R$ 299,90</p>
      <button onclick="adicionar('Relógio', 299.90)">Adicionar</button>
    </div>

  </div>

  <div class="carrinho">
    <h2>Carrinho</h2>

    <div id="itens"></div>

    <div class="total" id="total">
      Total: R$ 0,00
    </div>
  </div>

  <script>
    let total = 0

    function adicionar(nome, preco) {
      const itens = document.getElementById('itens')

      const item = document.createElement('div')
      item.classList.add('item-carrinho')

      item.innerHTML = `
        <span>${nome}</span>
        <span>R$ ${preco.toFixed(2)}</span>
      `

      itens.appendChild(item)

      total += preco

      document.getElementById('total').innerText =
        `Total: R$ ${total.toFixed(2)}`
    }
  </script>

</body>
</html>
